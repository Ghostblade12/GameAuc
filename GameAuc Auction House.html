<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="PIcs/logo.png" type="image/x-icon">
    <title>GameAuc Auction House</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap');

        /* Reset & CSS Variables */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        :root {
            --bg-dark: #0f0c1b;
            --bg-card: rgba(30, 24, 56, 0.5);
            --primary: #8b5cf6;
            --primary-hover: #9d74f7;
            --accent: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(139, 92, 246, 0.15);
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 15% 50%, rgba(129, 91, 218, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Notice Box */
        .notice-box {
            background-color: rgba(239, 68, 68, 0.05);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-left: 4px solid #ef4444;
            color: #fca5a5;
            padding-top: 1.5rem;
            padding-left: 1rem;
            padding-bottom: 1.5rem;
            padding-right: 1rem;
            border-radius: 8px;
            margin: 2rem 0 4rem;
            display: flex;
            gap: 1rem;
            align-items: center;
            text-align: center;
        }

        .notice-box strong {
            color: #ef4444;
        }

        .notice-box span.google {
            color: #60a5fa;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="notice-box">
        <div>
            <p>
                <strong>⚠️ Security Note:</strong> Beware of fake Game Account links. Before finalizing any purchase
                of any Game account, ask <span class="google">Google</span> and immediatly after successful payment
                change the link of your new Game account.
            </p>
        </div>
    </div>
      
</body>
</html>
