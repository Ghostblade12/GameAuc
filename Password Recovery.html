<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GameAuc - Recover Password</title>
  <link rel="shortcut icon" href="PIcs/logo.png" type="image/x-icon">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0f141d;
      color: #fff;
      background-image: url(PIcs/Eagle\ Logo\ \(2\).png);
    }

    .card {
      background: #18202c;
      border: 1px solid #2a374a;
      padding: 30px 35px;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    h2 {
      letter-spacing: 2px;
      color: #3b82f6;
      margin-bottom: 25px;
      font-size: 1.6rem;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 6px;
      border: 1px solid #000;
      background: #090d14;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: border 0.2s ease;
    }

    input:focus {
      border-color: #3b82f6;
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: #2e8b40;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #246e32;
    }

    .step {
      display: none;
    }

    .step.active {
      display: block;
    }

    .code-display {
      background: #090d14;
      border: 1px dashed #3b82f6;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-family: monospace;
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: #60a5fa;
    }

    .info-text {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 12px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>GAMEAUC</h2>

    <!-- STEP 1: Verify Email and Username -->
    <div id="step1" class="step active">
      <form onsubmit="handleSubmit(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="Username">Username</label>
          <input type="text" id="name" required>
        </div>
        <button type="submit" class="btn">Send Verification Code</button>
      </form>
    </div>

    <!-- STEP 2: Enter 7-Character Verification Code -->
    <div id="step2" class="step">
      <p class="info-text">Your 7-character verification code is:</p>
      <div id="generatedCodeDisplay" class="code-display"></div>

      <form id="codeForm">
        <div class="form-group">
          <label for="verificationCode">Enter Code</label>
          <input type="text" id="verificationCode" maxlength="7" required>
        </div>
        <button type="submit" class="btn">Verify Code</button>
      </form>
    </div>

    <!-- STEP 3: Change Password -->
    <div id="step3" class="step">
      <form id="resetForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" required>
        </div>
        <button type="submit" class="btn">Confirm & Save Password</button>
      </form>
    </div>
  </div>

        if (userData.Emailaddress == Emailaddress) {
         //Tell user something  has been sent to your email
              
         alert("A code has been sent to your Email")

      const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';

        }
        else {
          alert("Invalid Username or Email address")
        }
      }
      else {
        alert(" Invalid Username or Email address")
      }
    }
  </script>
</body>
</html>
