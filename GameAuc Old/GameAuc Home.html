<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="PIcs/logo.png" type="image/x-icon">
  <title>GameAuc Home</title>
  <style>
    :root {
      --bg-dark: #0d0f12;
      --card-bg: #1a1d2e;
      --accent-purple: #7c3aed;
      --accent-gold: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.6;
    }

    /* Fixed Top Navigation */
    header {
      background-color: #13161c;
      border-bottom: 1px solid #2d3748;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
    }

    .logo span {
      color: var(--accent-purple);
    }


    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #6366f1);
      color: white;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      text-decoration: none;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 4rem 2rem;
      background: radial-gradient(circle at top, #2e1065 0%, var(--bg-dark) 70%);
    }

    .hero h1 {
      font-size: 2.8rem;
      margin-bottom: 0.75rem;
    }

    .hero p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 550px;
      margin: 0 auto 1.5rem;
    }

  </style>
</head>
<body>
  <header>
    <div class="logo">🎮 Game<span>Auc</span>
    </div>
    <a href="GameAuc Sign in.html" class="btn-primary">Log out</a>
  </header>
  <section class="hero">
    <p>  </p>
  </section>
</body>
</html>
