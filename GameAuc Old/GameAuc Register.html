<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="shortcut icon" href="PIcs/logo.png" type="image/x-icon">
    <style>
        * {
            box-sizing: border-box;
            position: relative;
        }

        html {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
        }

        body {
            width: 100%;
            height: 100%;
            font-size: 0;
            padding: 0;
            margin: 0;
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-image: url("PIcs/Register .jpg");
        }

        a {
            color: white;
        }
    </style>
    <title>
        Register in to GameAuc
    </title>
</head>
<body>
    <div style="text-align: center; padding: 50px; display: flex; flex-direction: column; gap: 20px">

        <Header style="color: black; font-size: 25px; ">
            <b> Welcome to The Game Court</b>
        </Header>
        <Header style="color: black; font-size: 30px;">
            <b>Register here</b>
        </Header>
        
        <form onsubmit="handleSubmit(event)" style="display: flex; flex-direction: column; gap: 50px; margin-top: 40px;">
            <div>
                <label for="name"> Username </label>
                <input id="name" autocomplete="name" required type="text" placeholder="Username" />
            </div>
            <div>
                <input id="email" autocomplete="email" required type="email" placeholder="Emailaddress@gmail.com" />
            </div>
            <div>
                <select id="Buyer or Seller" name="Buyer or Seller" required placeholder="Who are you in this App">
                    <option value="" selected disabled> Who are you in this App </option>
                    <option value="Buyer"> Buyer </option>
                    <option value="Seller"> Seller </option>
                    <option value="Buyer and Seller"> Buyer and Seller </option>
                </select>
            </div>
            <div>
                <input id="Password" type="password" required placeholder="Password" />
                <input type="submit"/>
            </div>
        </form>
    </div>
             <Header style="font-size: 25px; text-align: center; flex-wrap: wrap;">
            <a style="color: black; font-size: 20px;" href="GameAuc Sign in.html">
                <b> Have an account?
                     <br>
                    Click here to Login</b>
            </a>
        </Header>
          
    <script>
        function handleSubmit(e) {
            e.preventDefault();    

            console.log("1")

            // collect Username
            let Usernameinput = document.getElementById("name");
            let Username = Usernameinput.value;
            // collect Email address
            let Emailaddressinput = document.getElementById("email");
            let Emailaddress = Emailaddressinput.value;
            // collect password
            let passwordinput = document.getElementById("Password");
            let password = passwordinput.value;
            console.log("2")

            // Dont allow space in username
            let Usernamehasspace = Username.includes(' ');
            if (Usernamehasspace) {
                alert("Space not allowed")
                return
            }
            // Check nobody has used the Username
            // look into the stoarage
            let oldUser = localStorage.getItem(Username);
            if (oldUser) {
                alert("Username has been taken")
                return
            } else {
                // store them
                let userData = JSON.stringify({
                    Username: Username,
                    Emailaddress: Emailaddress,
                    password: password
                });
                localStorage.setItem(Username, userData);
            }
            console.log("3")
            // Go to home page
            
          window.location.href = 'GameAuc Home.html'      
        }
    </script>
</body>
</html>
