<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="shortcut icon" href="PIcs/logo.png" type="image/x-icon">
    <title>Register - GameAuc</title>
   
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-image: url("pics/Register.jpg");
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            background-repeat: no-repeat;
            background-size: cover;
        }

        /* Dark overlay to ensure form readability over complex background */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 12, 22, 0.4);
            z-index: 0;
        }

        /* Main Registration Glass Container */
        .register-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 35px 30px;
            border: 1px solid rgba(0, 240, 255, 0.35);
            border-radius: 16px;
            text-align: center;
            color: #ffffff;
        }

        /* Corner Cut / Sci-Fi Accent Borders */
        .register-card::after {
            content: '';
            position: absolute;
            top: -4px;
            left: 20%;
            right: 20%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00f0ff, transparent);
        }

        .header-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00f0ff;
            text-transform: uppercase;
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
            margin-bottom: 4px;
            margin-top: -30px;
        }

        .header-subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 3px;
            color: white;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box i {
            position: absolute;
            left: 14px;
            color: #00f0ff;
            font-size: 16px;
            z-index: 2;
        }

        .input-box input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(15, 32, 54, 0.85);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        .input-box input:focus {
            border-color: #00f0ff;
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            background: rgba(18, 40, 68, 0.95);
        }

        /* Role Selector Styling */
        .role-section {
            margin-bottom: 22px;
            text-align: left;
        }

        .role-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            letter-spacing: 1.5px;
            color: white;
            margin-bottom: 8px;
            display: block;
            text-transform: uppercase;
        }

        .role-options {
            display: flex;
            gap: 8px;
            background: rgba(15, 32, 54, 0.85);
            padding: 5px;
            border-radius: 8px;
            border: 1px solid rgba(0, 210, 255, 0.25);
        }

        .role-option {
            flex: 1;
            position: relative;
        }

        .role-option input[type="radio"] {
            display: none;
        }

        .role-option label {
            display: block;
            padding: 8px 4px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.7);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .role-option input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            color: #ffffff;
            box-shadow: 0 0 10px rgba(0, 198, 255, 0.5);
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #00f0ff 0%, #0072ff 100%);
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 18px rgba(0, 240, 255, 0.4);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.7);
            background: linear-gradient(135deg, #33f3ff 0%, #1a82ff 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Footer Link */
        .login-link {
            margin-top: 20px;
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 600;
        }

        .login-link a {
            color: #00f0ff;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            text-decoration: underline;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.8);
        }
    </style>
</head>
<body>

    <div class="register-card">
        <h1 class="header-title">GameAuc</h1>
        <div class="header-subtitle">Register</div>

        <form onsubmit="handleSubmit(event)">
            <div class="form-group">
                <div class="input-box">
                    <i class="fa-solid fa-user"></i>
                    <input id="name" type="text" name="username" placeholder="Username *" maxlength="13" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-box">
                    <i class="fa-solid fa-envelope"></i>
                    <input id="email" type="email" name="email" placeholder="Email Address *" required>
                </div>
            </div>

            <div class="form-group">
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input id="Password" type="password" name="password" placeholder="Password *" required>
                </div>
            </div>

            <div class="role-section">
                <span class="role-label">Select Your Role</span>
                 <div class="role-options">
                    <div class="role-option">
                        <input type="radio" id="buyer" name="role" value="Buyer" checked>
                        <label for="buyer">Buyer</label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="seller" name="role" value="Seller">
                        <label for="seller">Seller</label>
                    </div>
                    <div class="role-option">
                        <input type="radio" id="both" name="role" value="Buyer & Seller">
                        <label for="both">Both</label>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>

        <div class="login-link">
            Already have an account? <a href="GameAuc Sign in 2.html">Login here</a>
        </div>
    </div>
      <script>
         function handleSubmit(e) {
            e.preventDefault();    

            console.log("1")
            
            // collect Username
            let Usernameinput = document.getElementById("name");
            let Username = Usernameinput.value;
            // collect Email address
            let Emailaddressinput = document.getElementById("email");
            let Emailaddress = Emailaddressinput.value;
            // collect password
            let passwordinput = document.getElementById("Password");
            let password = passwordinput.value;

            console.log("2")

            // Dont allow space in username
            let Usernamehasspace = Username.includes(' ');
            if (Usernamehasspace) {
                alert("Space not allowed")
                return
            }

            // Check nobody has used the Username
            // look into the stoarage
            let oldUser = localStorage.getItem(Username);
            if (oldUser) {
                alert("Username has been taken")
                return
            } else {
                // store them
                let userData = JSON.stringify({
                    Username: Username,
                    Emailaddress: Emailaddress,
                    password: password,
                });
                localStorage.setItem(Username, userData);
            }
            console.log("3")
            // Go to home page
            
          window.location.href = 'GameAuc Home 2.html'      
        }
      </script>
<!-- GameAuc network status bar -->
<style id="net-status-style">
    #netStatusBar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 2147483647;
        padding: 12px 16px;
        text-align: center;
        font: 700 15px/1.2 'Segoe UI', Tahoma, Arial, sans-serif;
        letter-spacing: 0.5px;
        color: #fff;
        background: #dc2626;
        transform: translateY(100%);
        transition: transform 0.45s ease, background-color 0.4s ease;
        pointer-events: none;
    }
    #netStatusBar.show { transform: translateY(0); }
    #netStatusBar.connected { background: #16a34a; }
    #netStatusBar .dots::after {
        content: '';
        animation: netDots 1.2s steps(4, end) infinite;
    }
    #netStatusBar.connected .dots::after,
    #netStatusBar.offline .dots::after { animation: none; content: ''; }
    @keyframes netDots {
        0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; }
    }
</style>
<div id="netStatusBar" role="status" aria-live="polite"><span class="text"></span><span class="dots"></span></div>
<script id="net-status-script">
(function () {
    var bar = document.getElementById('netStatusBar');
    var text = bar.querySelector('.text');
    var hideTimer = null;
    var wasBad = false;          // true once we've shown a red state
    var state = 'good';          // good | reconnecting | offline
    var probing = false;

    function show(cls, msg) {
        clearTimeout(hideTimer);
        bar.className = cls + ' show';
        text.textContent = msg;
    }

    function setState(next) {
        if (next === state) return;
        state = next;
        if (next === 'offline') {
            wasBad = true;
            show('offline', 'Offline');
        } else if (next === 'reconnecting') {
            wasBad = true;
            show('reconnecting', 'Reconnecting');
        } else if (next === 'good' && wasBad) {
            wasBad = false;
            show('connected', 'Connected');
            hideTimer = setTimeout(function () {
                bar.classList.remove('show');   // glide back down
            }, 2500);
        }
    }

    // Real connectivity test: online if ANY of several hosts responds
    // (one host being blocked on a network no longer causes a false "Reconnecting")
    var ENDPOINTS = [
        'https://www.gstatic.com/generate_204',
        'https://fonts.googleapis.com/css2?family=Inter',
        'https://1.1.1.1/cdn-cgi/trace',
        'https://www.cloudflare.com/cdn-cgi/trace'
    ];
    var fails = 0;               // consecutive failed checks
    var FAILS_NEEDED = 2;        // avoid flicker from one bad check

    function ping(url, ms) {
        return new Promise(function (resolve, reject) {
            var ctrl = window.AbortController ? new AbortController() : null;
            var t = setTimeout(function () { if (ctrl) ctrl.abort(); reject(); }, ms);
            fetch(url + (url.indexOf('?') > -1 ? '&' : '?') + '_=' + Date.now(), {
                mode: 'no-cors', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined
            }).then(function () { clearTimeout(t); resolve(); },
                    function () { clearTimeout(t); reject(); });
        });
    }

    function anyOk() {
        return new Promise(function (resolve) {
            var left = ENDPOINTS.length, done = false;
            ENDPOINTS.forEach(function (u) {
                ping(u, 6000).then(function () {
                    if (!done) { done = true; resolve(true); }
                }, function () {
                    if (--left === 0 && !done) resolve(false);
                });
            });
        });
    }

    function probe() {
        if (!navigator.onLine) { fails = FAILS_NEEDED; setState('offline'); return; }
        if (probing) return;
        probing = true;
        anyOk().then(function (ok) {
            probing = false;
            if (ok) { fails = 0; setState('good'); }
            else if (++fails >= FAILS_NEEDED) {
                setState(navigator.onLine ? 'reconnecting' : 'offline');
            }
        });
    }

    window.addEventListener('offline', function () { setState('offline'); });
    window.addEventListener('online', function () {
        if (state === 'offline') setState('reconnecting');
        probe();
    });
    if (navigator.connection && navigator.connection.addEventListener) {
        navigator.connection.addEventListener('change', probe);
    }
    document.addEventListener('visibilitychange', function () { if (!document.hidden) probe(); });

    setInterval(probe, 4000);
    if (!navigator.onLine) setState('offline'); else probe();
})();
</script>

</body>
</html>
